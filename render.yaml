# Render Blueprint for the CityFlow backend (API + PostgreSQL).
# In Render: New > Blueprint > pick this repo. Render serves it over HTTPS at
# https://<service-name>.onrender.com. The frontend is published from Lovable;
# set its VITE_CITYFLOW_API_URL to that address.
services:
  - type: web
    name: cityflow-api
    runtime: docker
    # Build from the repo root so the dataset and ML outputs are in the image.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    region: singapore # closest Render region to Bengaluru
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cityflow-db
          property: connectionString
      # Key for changing events; Render generates it. Copy it from the
      # service's Environment tab into the Events page's "Admin key" box.
      - key: ADMIN_TOKEN
        generateValue: true
      # One Render load balancer sits in front of the app (report rate limit).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Asked for when the Blueprint is created; never stored in git.
      # The published frontend's address, e.g. https://cityflow.lovable.app
      - key: CORS_ORIGINS
        sync: false
      # Google AI Studio key for checking incident photos.
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: cityflow-db
    region: singapore
    plan: free
    databaseName: cityflow
    user: cityflow
    # Reachable only from Render services, not the public internet.
    ipAllowList: []
